[package]
name = "near-nft-contract"
version = "0.1.0"
edition = "2021"
description = "Minimal NEP-171 NFT contract for the NEAR NFT marketplace"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
testnet = []
production = []
# Native Wasm harness only; no contract methods or mint/trading activation.
vm-tests = ["near-vm-runner/wasmtime_vm"]

[dependencies]
near-sdk = "=5.30.0"
near-contract-standards = "=5.30.0"
near-sys = "=0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
near-vm-runner = { version = "=0.38.0", default-features = false }
near-parameters = "=0.38.0"
near-primitives-core = "=0.38.0"

[profile.dev]
debug = 0

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true
