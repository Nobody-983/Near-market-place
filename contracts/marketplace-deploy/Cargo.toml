[package]
name = "near-marketplace"
version = "0.1.0"
edition = "2021"
description = "Deployable fixed-price NEAR marketplace (approval-based) for the NEAR NFT Marketplace"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
testnet = []
production = []

[dependencies]
near-sdk = "=5.30.0"
near-contract-standards = "=5.30.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }
near-contract-standards = "=5.30.0"
near-vm-runner = { version = "=0.38.0", default-features = false }
near-parameters = "=0.38.0"
near-primitives-core = "=0.38.0"
getrandom = { version = "0.2", features = ["js"] }

[profile.dev]
debug = 0

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true