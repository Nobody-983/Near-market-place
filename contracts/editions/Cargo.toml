[package]
name = "near-editions-contract"
version = "0.1.0"
edition = "2021"
description = "NEP-245 Multi-Token Edition Contract for NEAR NFT Marketplace"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
testnet = []

[dependencies]
near-sdk = "=5.30.0"
near-contract-standards = "=5.30.0"
near-sys = "=0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }

[profile.dev]
debug = 0

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true

