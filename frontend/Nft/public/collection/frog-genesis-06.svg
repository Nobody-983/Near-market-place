<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#142544"/>
      <stop offset="100%" stop-color="#08101e"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65C99A"/>
      <stop offset="100%" stop-color="#9A8AFB"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65C99A"/>
      <stop offset="50%" stop-color="#62C9B8"/>
      <stop offset="100%" stop-color="#9A8AFB"/>
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- Ambient background glow aura -->
  <circle cx="300" cy="300" r="180" fill="#65C99A" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="300" cy="270" r="120" fill="#62C9B8" opacity="0.12" filter="url(#softGlow)" />

  <!-- Background Geo Framework -->
  <g stroke="#9A8AFB" stroke-width="1" opacity="0.25">
    <circle cx="300" cy="300" r="240" fill="none" stroke-dasharray="6,6" />
    <circle cx="300" cy="300" r="270" fill="none" stroke-dasharray="2,8" />
    <line x1="60" y1="300" x2="540" y2="300" />
    <line x1="300" y1="60" x2="300" y2="540" />
    <!-- Diagonal tick marks -->
    <path d="M 120 120 L 140 140 M 480 120 L 460 140 M 120 480 L 140 460 M 480 480 L 460 460" stroke-width="2" />
  </g>

  <!-- Cybernetic Floating Emblems / Rarity Frame -->
  <rect x="25" y="25" width="550" height="550" rx="20" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="530" height="530" rx="14" fill="none" stroke="#65C99A" stroke-width="1" opacity="0.3" stroke-dasharray="10, 15"/>

  <!-- Frog Body Base Silhouette -->
  <!-- Torso & Shoulders -->
  <path d="M 210 440 C 190 380 180 340 230 310 C 260 290 340 290 370 310 C 420 340 410 380 390 440 C 370 480 230 480 210 440 Z" fill="url(#bodyGrad)" opacity="0.85" />

  <!-- Cyber Chest Core / Emblem -->
  <polygon points="300,340 330,370 300,410 270,370" fill="#08101e" stroke="#62C9B8" stroke-width="3" filter="url(#neonGlow)"/>
  <circle cx="300" cy="373" r="8" fill="undefined" filter="url(#neonGlow)"/>

  <!-- Frog Head & Iconic Cheeks -->
  <ellipse cx="300" cy="270" rx="115" ry="85" fill="url(#bodyGrad)" stroke="#65C99A" stroke-width="2"/>
  <path d="M 200 275 C 200 320 250 335 300 335 C 350 335 400 320 400 275 C 400 240 370 215 300 215 C 230 215 200 240 200 275 Z" fill="#08101e" opacity="0.4" />

  <!-- Iconic Frog Eye Pods -->
  <!-- Left Eye Pod -->
  <circle cx="230" cy="205" r="46" fill="url(#bodyGrad)" stroke="#65C99A" stroke-width="3" />
  <circle cx="230" cy="205" r="34" fill="#08101e" stroke="#62C9B8" stroke-width="2" />
  <circle cx="230" cy="205" r="22" fill="#65C99A" filter="url(#neonGlow)" />
  <ellipse cx="230" cy="205" rx="6" ry="18" fill="#FFFFFF" />

  <!-- Right Eye Pod -->
  <circle cx="370" cy="205" r="46" fill="url(#bodyGrad)" stroke="#65C99A" stroke-width="3" />
  <circle cx="370" cy="205" r="34" fill="#08101e" stroke="#62C9B8" stroke-width="2" />
  <circle cx="370" cy="205" r="22" fill="#65C99A" filter="url(#neonGlow)" />
  <ellipse cx="370" cy="205" rx="6" ry="18" fill="#FFFFFF" />

  <!-- Special Trait Overlays -->
  

  
  <!-- Sovereign Crown of Starlight -->
  <polygon points="250,155 270,120 300,145 330,120 350,155 300,165" fill="#62C9B8" stroke="#FFFFFF" stroke-width="2" filter="url(#neonGlow)"/>
  <circle cx="270" cy="115" r="4" fill="#FFFFFF" filter="url(#neonGlow)"/>
  <circle cx="300" cy="110" r="6" fill="#FFFFFF" filter="url(#neonGlow)"/>
  <circle cx="330" cy="115" r="4" fill="#FFFFFF" filter="url(#neonGlow)"/>
  

  

  <!-- Mouth / Cybernetic Grill -->
  <path d="M 265 295 Q 300 310 335 295" stroke="#65C99A" stroke-width="4" stroke-linecap="round" fill="none" />
  <line x1="285" y1="298" x2="285" y2="304" stroke="#9A8AFB" stroke-width="2"/>
  <line x1="300" y1="300" x2="300" y2="306" stroke="#9A8AFB" stroke-width="2"/>
  <line x1="315" y1="298" x2="315" y2="304" stroke="#9A8AFB" stroke-width="2"/>

  <!-- Badge Details Banner -->
  <g transform="translate(300, 520)">
    <!-- Label Backdrop -->
    <rect x="-140" y="-18" width="280" height="36" rx="10" fill="#08101e" stroke="url(#accentGrad)" stroke-width="1.5" />
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      AURORA LEAP #06
    </text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(300, 75)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#08101e" stroke="#65C99A" stroke-width="1" opacity="0.85" />
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#65C99A" text-anchor="middle" letter-spacing="1.5">
      ROUNDFROG • LEGENDARY
    </text>
  </g>
</svg>